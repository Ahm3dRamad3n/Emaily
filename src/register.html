<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create your account — Emaily</title>
    <link rel="icon" href="../assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Sora", "ui-sans-serif", "system-ui", "sans-serif"],
              body: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="font-body" data-page="register">
    <div
      id="toast-container"
      class="fixed top-4 right-4 z-[100] flex flex-col gap-2 items-end"
    ></div>

    <header class="glass sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between"
      >
        <a href="../index.html" class="flex items-center gap-3">
          <img
            src="../assets/logo.png"
            alt="Emaily"
            class="h-9 w-9 object-contain drop-shadow-[0_0_12px_rgba(139,92,246,0.55)]"
          />
          <span
            class="font-display font-bold text-lg tracking-tight shimmer-text"
            >Emaily</span
          >
        </a>
        <a href="login.html" class="btn btn-ghost btn-sm"
          >Already have an account?</a
        >
      </div>
    </header>

    <main class="min-h-[80vh] flex items-center justify-center px-6 py-16">
      <div class="w-full max-w-md">
        <div class="glass glass-panel p-8">
          <h1 class="font-display text-xl font-bold mb-1">
            Create your account
          </h1>
          <p class="text-secondary text-sm mb-6">
            Get an API key in under a minute.
          </p>

          <form id="form-register" class="space-y-4"></form>

          <p class="text-secondary text-sm text-center mt-6">
            Already have an account?
            <a href="login.html" class="text-gradient-aurora font-semibold"
              >Sign in</a
            >
          </p>
        </div>
      </div>
    </main>

    <footer id="dynamic-footer" class="mt-auto w-full"></footer>

    <div id="modal-root" class="hidden fixed inset-0 z-[90]"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
