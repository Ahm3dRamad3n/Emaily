<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Emaily</title>
    <link rel="icon" href="../../assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Sora", "ui-sans-serif", "system-ui", "sans-serif"],
              body: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="font-body" data-page="login">
    <div
      id="toast-container"
      class="fixed top-4 right-4 z-[100] flex flex-col gap-2 items-end"
    ></div>

    <header class="glass sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between"
      >
        <a href="../index.html" class="flex items-center gap-3">
          <img
            src="../assets/logo.png"
            alt="Emaily"
            class="h-9 w-9 object-contain drop-shadow-[0_0_12px_rgba(139,92,246,0.55)]"
          />
          <span
            class="font-display font-bold text-lg tracking-tight shimmer-text"
            >Emaily</span
          >
        </a>
        <a href="register.html" class="btn btn-ghost btn-sm"
          >Need an account?</a
        >
      </div>
    </header>

    <main class="min-h-[80vh] flex items-center justify-center px-6 py-16">
      <div class="w-full max-w-md">
        <div class="glass glass-panel p-8">
          <h1 class="font-display text-xl font-bold mb-1">Sign in</h1>
          <p class="text-secondary text-sm mb-6">Welcome back to Emaily.</p>

          <form id="form-login" class="space-y-4">
            <div>
              <label class="field-label" for="login-email">Email</label>
              <input
                class="input-glass"
                type="email"
                id="login-email"
                name="email"
                placeholder="you&#64;example.com"
                required
              />
            </div>
            <div>
              <label class="field-label" for="login-password">Password</label>
              <input
                class="input-glass"
                type="password"
                id="login-password"
                name="password"
                placeholder="••••••••"
                required
              />
            </div>
            <p class="field-error hidden" data-error-for="login"></p>
            <button type="submit" class="btn btn-aurora w-full justify-center">
              Sign in
            </button>
            <button
              type="button"
              class="text-xs text-tertiary hover:text-secondary transition-colors block mx-auto"
              data-action="forgot-password"
            >
              Forgot your password?
            </button>
          </form>

          <p class="text-secondary text-sm text-center mt-6">
            New to Emaily?
            <a href="register.html" class="text-gradient-aurora font-semibold"
              >Create an account</a
            >
          </p>
        </div>
      </div>
    </main>

    <div id="modal-root" class="hidden fixed inset-0 z-[90]"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
